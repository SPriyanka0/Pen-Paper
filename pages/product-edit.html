<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Product Edit</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/index.html"><img class="logo-img" src="/images/logo_pen.png" alt="logo"></a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item active">
                <a class="nav-link" href="/pages/admin-landing.html">Admin Home <span class="sr-only">(current)</span></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/pages/admin-upload.html">Bulk Upload</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/pages/admin-products.html">Product Listing</a>
              </li>
              <li class="nav-item">
                <a class="nav-link " href="/pages/product-edit.html">Product Edit</a>
              </li>
            </ul>
          </div>
        </nav>

      <form action="" method="post" id="edit_product">
        <div class="form-group">
            <label for="">Product ID (not editable)</label>
            <input type="text" id="product_ID" value="##" readonly>
        </div>
        <div class="form-group">
            <label for="">Product Name</label>
            <input type="text" id="product-name">
        </div>
        <div class="form-group">
            <label for="">Product Description</label>
            <input type="text" id="product_info">
        </div>
        <div class="form-group">
            <label for=""> Category ID (or name)</label>
            <input type="text" id="category_id">
        </div>
        <div class="form-group">
            <label for="">Image Path</label>
            <input type="text" id="image_path">
        </div>
        <div class="form-group">
            <label for="">Price</label>
            <input type="number" id="product-price">
        </div>
           
        <button ><a href="#">Submit</a>
        </button>
      </form>
</body>
</html>
