<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Bulk Upload</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="index.html"><img class="logo-img" src="images/logo_pen.png" alt="logo"></a>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="index.html">User Home<span class="sr-only"></span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin-products.html">Edit</a>
        </li>
       
        <li class="nav-item">
            <a class="nav-link" href="admin-upload.html">Bulk-Upload</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html">Log-out</a>
          </li>
      </ul>
    </div>
  </nav>

  <div style="margin: 30px;">
    <!-- product form -->
   <form id="addProductFrorm">
    <div class="form-group">
      <label for="productId">Id</label>
      <input type="number" id="productId" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productName">Name</label>
      <input type="text" id="productName" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productDesc">Description</label>
      <input type="text" id="productDesc" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productPrice">Price</label>
      <input type="number" id="productPrice" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productQuantity">Quantity</label>
      <input type="number" id="productQuantity" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productImageURL">Image URL</label>
      <input type="text" id="productImageURL" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="productCategory">Category</label>
      <input type="text" id="productCategory" class="form-control" required>
    </div>

    <button type="submit">Add Product</button>
   </form>
  </div>

  <script src="js/bulk.js"></script>
</body>
</html>
