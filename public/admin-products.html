<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Product Listing</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="index.html"><img class="logo-img" src="images/logo_pen.png" alt="logo"></a>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="index.html">User Home<span class="sr-only"></span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="admin-products.html">Edit</a>
        </li>
       
        <li class="nav-item">
            <a class="nav-link" href="admin-upload.html">Bulk-Upload</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html">Log-out</a>
          </li>
      </ul>
    </div>
  </nav>

  <div id="showDiv" class="card" style="margin: 30px;padding: 20px;">
    <form id="editProductbyID">
      <h4>Edit Product</h4>
      <!-- <div class="form-group">
        <label for="editId">SKU</label>
        <input type="number" id="editId" class="form-control" required>
      </div> -->
      <div class="form-group">
        <label for="editName">Name</label>
        <input type="text" id="editName" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="editDesc">Description</label>
        <input type="text" id="editDesc" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="editImageURL">Image URL</label>
        <input type="text" id="editImageURL" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="editPrice">Price</label>
        <input type="number" id="editPrice" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="editQuantity">Stock Quantity</label>
        <input type="number" id="editQuantity" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="editCategory">Category</label>
        <input type="number" id="editCategory" class="form-control" required>
      </div>
      <button class="btn btn-primary">Save</button>
      <button id="cancelEdit" class="btn btn-primary">Cancel</button>
    </form>
  </div>
  
   
  <!-- Product Table -->
  <div class="container" id="productsTable">
    <table style="width: 100%; font-size: larger; ">
      <thead>
        <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Quantity In Stock</th>
        <th>Category</th>
        <th>Actions</th>
        </tr>
      </thead>
      <tbody >

      </tbody>
    </table>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
